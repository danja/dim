## DIM.
##
##   docker compose up -d                    store, embeddings and the app
##
## One-off commands run against the same image and the same volume as the
## service, so the index they build is the index the app serves:
##
##   docker compose run --rm app node bin/retrieve.js --live --limit 50
##   docker compose run --rm app node bin/ingest.js --no-fetch --skip-embeddings
##   docker compose run --rm app node bin/enrich.js --limit 50 --summariser extractive
##   docker compose run --rm app node bin/validate.js
##
## Secrets come from .env, which compose reads for substitution here and which
## .dockerignore keeps out of the image.
##
## ── Memory ──────────────────────────────────────────────────────────────────
##
## Sized to fit a 4 GB server. Every limit is overridable from .env, and the
## defaults are deliberately modest rather than comfortable.
##
## `memswap_limit` equal to `mem_limit` means *no swap for this container*, and
## that is the point of setting it. Swap is worth having on a small host, but
## not for these two processes: a JVM garbage collection walks the whole live
## heap, so a paged-out heap turns a GC into a disk I/O storm, and Ollama reads
## its model weights on every forward pass. Both must stay resident. Swap then
## does its real job — absorbing cold pages elsewhere on the system and keeping
## the OOM killer away from the store.
##
## (Docker needs cgroup v2, or `swapaccount=1` on a cgroup v1 kernel, to honour
## memswap_limit. If it cannot, it warns and ignores it rather than failing.)
##
## Deployment method follows ~/github/plugin-universe (docs/deployment.md
## there): same images, same volume layout, same loopback-only publishing.
## DIM runs on localhost in the first instance, so there is no nginx profile
## here — see docs/deployment.md.

services:
  fuseki:
    image: secoresearch/fuseki:latest
    container_name: dim-fuseki
    ports:
      # Bound to the loopback interface: the store is reached through the app,
      # and a TDB2 update endpoint on a public port is not something to expose
      # by accident.
      - "127.0.0.1:${FUSEKI_PORT:-3031}:3030"
    environment:
      ADMIN_PASSWORD: ${SPARQL_PASSWORD:?SPARQL_PASSWORD must be set}
      ENABLE_DATA_WRITE: "true"
      ENABLE_UPDATE: "true"
      ENABLE_UPLOAD: "true"
      # TDB2 memory-maps its indexes and leans on the OS page cache, not the
      # Java heap, so a large -Xmx does not help it and takes memory the page
      # cache would use better. 1g is already generous for this catalogue.
      # Raise it only with a measurement in hand.
      JVM_ARGS: -Xmx${FUSEKI_HEAP:-1g}
    mem_limit: ${FUSEKI_MEM:-1400m}
    memswap_limit: ${FUSEKI_MEM:-1400m}
    volumes:
      # This image is secoresearch/fuseki: its base is /fuseki-base, not the
      # /fuseki that the official images use. A config mounted at the wrong
      # path is not an error — Fuseki simply never reads it, and the dataset
      # silently is not there.
      - fuseki-data:/fuseki-base/databases
      - ./config/fuseki/assembler-tdb2.ttl:/fuseki-base/configuration/dim.ttl:ro
    healthcheck:
      # wget, not curl: this image has no curl, and a healthcheck that can
      # never pass makes every dependant fail with "dependency failed to
      # start" while the container itself is perfectly healthy.
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3030/$$/ping > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: dim-ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    environment:
      # Search embeds the query text, so this is a serving dependency and not
      # only a batch one. Keeping the model loaded costs a few hundred megabytes
      # and saves a reload on the first search after an idle spell; releasing it
      # is the trade for a smaller resident footprint overnight.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      # One small model, one request at a time. Both bound the memory this can
      # reach for, which matters more here than throughput.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    mem_limit: ${OLLAMA_MEM:-1600m}
    memswap_limit: ${OLLAMA_MEM:-1600m}
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  app:
    build: .
    container_name: dim-app
    ports:
      - "127.0.0.1:${APP_PORT:-4110}:4110"
    environment:
      # Service names, not localhost: inside the compose network these resolve
      # to the other containers. Set here rather than in .env because they are
      # deployment topology, not secrets.
      SPARQL_URL_BASE: http://fuseki:3030
      SPARQL_DATASET: ${SPARQL_DATASET:-dim}
      SPARQL_USER: ${SPARQL_USER:?SPARQL_USER must be set}
      SPARQL_PASSWORD: ${SPARQL_PASSWORD:?SPARQL_PASSWORD must be set}
      OLLAMA_URL: http://ollama:11434
      # Optional: lifts the GitHub API limit for enrichment from 60 to 5000
      # requests an hour. Empty means unauthenticated.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Optional: enables writes (notes, tags, links); see .env.example.
      DIM_WRITE_TOKEN: ${DIM_WRITE_TOKEN:-}
      # Optional remote LLM for --summariser remote (see .env.example).
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
      LLM_PROVIDERS: ${LLM_PROVIDERS:-}
      # Bookmarks saved in DIM are fetched, summarised and embedded at once
      # (AUTO_ENRICH=0: off), with this summariser: ollama | remote | extractive.
      AUTO_ENRICH: ${AUTO_ENRICH:-}
      ENRICH_SUMMARISER: ${ENRICH_SUMMARISER:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      # Where DIM is reached (https://… when behind a proxy for the phone);
      # makes the session cookie https-only. DIM_PRIVATE=1: every page needs
      # a login — set it whenever DIM is reachable from anything but this host.
      DIM_ORIGIN: ${DIM_ORIGIN:-}
      DIM_PRIVATE: ${DIM_PRIVATE:-}
      NEWS_POLL_MINUTES: ${NEWS_POLL_MINUTES:-}
      BLOG_TITLE: ${BLOG_TITLE:-}
      BLOG_AUTHOR: ${BLOG_AUTHOR:-}
      BLOG_BASE_URL: ${BLOG_BASE_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-}
      LOG_REQUESTS: ${LOG_REQUESTS:-}
      PORT: "4110"
      # Modest by default and overridden from compose. The working set is the
      # document map and a few megabytes of vector index, not gigabytes.
      NODE_OPTIONS: --max-old-space-size=${NODE_HEAP:-256}
    # A little swap headroom here, unlike the store: Node's cold pages are
    # exactly what swap is good for, and a stall in the web tier is recoverable
    # in a way that a stalled garbage collector is not.
    mem_limit: ${APP_MEM:-384m}
    memswap_limit: ${APP_MEMSWAP:-640m}
    volumes:
      # The vector index and the harvest caches are state. They survive a
      # rebuild, and `docker compose run` shares them with the running service.
      - app-data:/app/data
      # Backups land on the host (bin/backup.js). The directory must be
      # writable by the app user (uid 1001): see docs/deployment.md.
      - ${BACKUP_HOST_DIR:-./backups}:/app/data/backups
    healthcheck:
      # /health answers 503 when the store or a facet is failing.
      test: ["CMD", "node", "-e", "fetch('http://localhost:4110/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      fuseki:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

volumes:
  fuseki-data:
  ollama-models:
  app-data:
